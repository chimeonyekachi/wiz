trigger: none
#   branches:
#     include:
#       - main
#       - develop

variables:
  - group: "wiz_ado_group"
  - name: imageName
    value: "tasky"
  - name: tag
    value: "$(Build.BuildNumber)"
  - name: ACR_LOGIN_SERVER
    value: "mywizacr.azurecr.io"
  - name: KUBE_SERVICE_CONNECTION
    value: "ado_wiz_aks_svc"

  ## Below variables and values will be in 
  # imageName: "tasky"
  # ACR_RESOURCE: "ado_wiz_acr_svc"
  # K8S_NAMESPACE: "wiz"

stages:
  - stage: BuildAndPush
    displayName: Build, Scan & Push
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: Docker@2
            displayName: "Build Docker Image"
            inputs:
              command: build
              containerRegistry: $(ACR_RESOURCE)
              repository: $(imageName)
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: "Push Docker Image"
            inputs:
              command: push
              containerRegistry: $(ACR_RESOURCE)
              repository: $(imageName)
              tags: |
                $(tag)

          - task: Bash@3
            displayName: "Scan image with Trivy (warnings)"
            inputs:
              targetType: inline
              script: |
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
                trivy image --exit-code 1 --severity HIGH,CRITICAL $(ACR_LOGIN_SERVER)/$(imageName):$(tag) || true

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: BuildAndPush
    jobs:
      - deployment: DeployToAKS
        displayName: Deploy to AKS (KubernetesManifest)
        environment: 'aks'
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: KubernetesManifest@0
                  displayName: "Deploy manifests to AKS"
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(KUBE_SERVICE_CONNECTION)
                    namespace: $(K8S_NAMESPACE)
                    manifests: |
                      k8s/wiz_aks_manifest.yaml
                    containers: |
                      $(ACR_LOGIN_SERVER)/$(imageName):$(tag)
